<div class="header">
  <h1>Rooms</h1>
  <button (click)="addMockRoom()">+ Add Room</button>
</div>

<div class="grid">
  <div class="card" *ngFor="let room of rooms()">

    <div class="top">
      <h2>Room {{ room.number }}</h2>
      <span class="status" [ngClass]="getStatus(room.id)">
        {{ getStatus(room.id) }}
      </span>
    </div>

    <p>Type: {{ room.type }}</p>
    <p>Price: €{{ room.price }}</p>

    <div class="booking-info" *ngIf="getCurrentBooking(room.id) as booking">
      <p><strong>Guest:</strong> {{ getGuestName(booking.guestId) }}</p>
      <p><strong>Check-in:</strong> {{ booking.checkIn | date }}</p>
      <p><strong>Check-out:</strong> {{ booking.checkOut | date }}</p>
      <p *ngIf="booking.notes">{{ booking.notes }}</p>
    </div>

  </div>
</div>
