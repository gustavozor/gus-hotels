<h1>Dashboard</h1>

<div class="cards">
  <div class="card">
    <p>Total Rooms</p>
    <h2>{{ totalRooms() }}</h2>
  </div>

  <div class="card">
    <p>Available Rooms</p>
    <h2>{{ availableRooms() }}</h2>
  </div>

  <div class="card">
    <p>Occupied Rooms</p>
    <h2>{{ occupiedRooms() }}</h2>
  </div>

  <div class="card">
    <p>Occupancy Rate</p>
    <h2>{{ occupancyRate() }}%</h2>
  </div>

  <div class="card">
    <p>Active Bookings</p>
    <h2>{{ activeBookings() }}</h2>
  </div>
</div>
